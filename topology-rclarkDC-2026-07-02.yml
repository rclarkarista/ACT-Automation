  - connection: [rclarkDC-A-spine1:Ethernet2, rclarkDC-A-leaf2:Ethernet1]
  - connection: [rclarkDC-A-spine1:Ethernet3, rclarkDC-A-leaf3:Ethernet1]
  - connection: [rclarkDC-A-spine1:Ethernet4, rclarkDC-A-leaf4:Ethernet1]
  - connection: [rclarkDC-A-spine2:Ethernet1, rclarkDC-A-leaf1:Ethernet2]
  - connection: [rclarkDC-A-spine2:Ethernet2, rclarkDC-A-leaf2:Ethernet2]
  - connection: [rclarkDC-A-spine2:Ethernet3, rclarkDC-A-leaf3:Ethernet2]
  - connection: [rclarkDC-A-spine2:Ethernet4, rclarkDC-A-leaf4:Ethernet2]

  # Datacenter A — leaf MLAG peer links
  - connection: [rclarkDC-A-leaf1:Ethernet3, rclarkDC-A-leaf2:Ethernet3]
  - connection: [rclarkDC-A-leaf1:Ethernet4, rclarkDC-A-leaf2:Ethernet4]
  - connection: [rclarkDC-A-leaf3:Ethernet3, rclarkDC-A-leaf4:Ethernet3]
  - connection: [rclarkDC-A-leaf3:Ethernet4, rclarkDC-A-leaf4:Ethernet4]

  # Datacenter A — border <-> spine
  - connection: [rclarkDC-A-border1:Ethernet1, rclarkDC-A-spine1:Ethernet5]
  - connection: [rclarkDC-A-border2:Ethernet1, rclarkDC-A-spine1:Ethernet6]
  - connection: [rclarkDC-A-border1:Ethernet2, rclarkDC-A-spine2:Ethernet5]
  - connection: [rclarkDC-A-border2:Ethernet2, rclarkDC-A-spine2:Ethernet6]

  # Datacenter A — border MLAG peer
  - connection: [rclarkDC-A-border1:Ethernet3, rclarkDC-A-border2:Ethernet3]
  - connection: [rclarkDC-A-border1:Ethernet4, rclarkDC-A-border2:Ethernet4]

  # Datacenter B — spine <-> leaf full mesh
  - connection: [rclarkDC-B-spine1:Ethernet1, rclarkDC-B-leaf1:Ethernet1]
  - connection: [rclarkDC-B-spine1:Ethernet2, rclarkDC-B-leaf2:Ethernet1]
  - connection: [rclarkDC-B-spine1:Ethernet3, rclarkDC-B-leaf3:Ethernet1]
  - connection: [rclarkDC-B-spine1:Ethernet4, rclarkDC-B-leaf4:Ethernet1]
  - connection: [rclarkDC-B-spine2:Ethernet1, rclarkDC-B-leaf1:Ethernet2]
  - connection: [rclarkDC-B-spine2:Ethernet2, rclarkDC-B-leaf2:Ethernet2]
  - connection: [rclarkDC-B-spine2:Ethernet3, rclarkDC-B-leaf3:Ethernet2]
  - connection: [rclarkDC-B-spine2:Ethernet4, rclarkDC-B-leaf4:Ethernet2]

  # Datacenter B — leaf MLAG peer links
  - connection: [rclarkDC-B-leaf1:Ethernet3, rclarkDC-B-leaf2:Ethernet3]
  - connection: [rclarkDC-B-leaf1:Ethernet4, rclarkDC-B-leaf2:Ethernet4]
  - connection: [rclarkDC-B-leaf3:Ethernet3, rclarkDC-B-leaf4:Ethernet3]
  - connection: [rclarkDC-B-leaf3:Ethernet4, rclarkDC-B-leaf4:Ethernet4]

  # Datacenter B — border <-> spine
  - connection: [rclarkDC-B-border1:Ethernet1, rclarkDC-B-spine1:Ethernet5]
  - connection: [rclarkDC-B-border2:Ethernet1, rclarkDC-B-spine1:Ethernet6]
  - connection: [rclarkDC-B-border1:Ethernet2, rclarkDC-B-spine2:Ethernet5]
  - connection: [rclarkDC-B-border2:Ethernet2, rclarkDC-B-spine2:Ethernet6]

  # Datacenter B — border MLAG peer
  - connection: [rclarkDC-B-border1:Ethernet3, rclarkDC-B-border2:Ethernet3]
  - connection: [rclarkDC-B-border1:Ethernet4, rclarkDC-B-border2:Ethernet4]

  # Backbone — border <-> backbone
  - connection: [rclarkDC-A-border1:Ethernet5, rclarkDC-bb1:Ethernet1]
  - connection: [rclarkDC-A-border2:Ethernet5, rclarkDC-bb1:Ethernet2]
