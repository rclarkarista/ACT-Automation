###############################################################################
# Generated by generate.sh on 2026-06-09.
#
# Filename convention: topology-<prefix>-<YYYY-MM-DD>.yml — ACT requires
# unique filenames across the tenant. Re-run generate.sh on another day to
# get a fresh filename.
#
# Switch identity is pinned via serial_number + system_mac_address so devices
# keep the same identity in CVaaS across redeploys.
###############################################################################

veos:
  username: cvpadmin
  password: cvp123!
  version: 4.35.4M
  # Required for CVaaS: every vEOS needs outbound internet to reach
  # apiserver.arista.io. This toolkit targets CVaaS (not on-prem CVP, which
  # ACT can stand up locally), so we always enable it.
  internet_access: true

nodes:

  ###########################################################################
  # Spines
  ###########################################################################

  - rclarkavd-spine1:
      node_type: veos
      ip_addr: 192.168.0.11/24
      serial_number: rclarkavd-spine1
      system_mac_address: 00:1c:73:00:01:01
      ztp: false

  - rclarkavd-spine2:
      node_type: veos
      ip_addr: 192.168.0.12/24
      serial_number: rclarkavd-spine2
      system_mac_address: 00:1c:73:00:01:02
      ztp: false

  ###########################################################################
  # Leaves
  ###########################################################################

  - rclarkavd-leaf1:
      node_type: veos
      ip_addr: 192.168.0.21/24
      serial_number: rclarkavd-leaf1
      system_mac_address: 00:1c:73:00:02:01
      ztp: false

  - rclarkavd-leaf2:
      node_type: veos
      ip_addr: 192.168.0.22/24
      serial_number: rclarkavd-leaf2
      system_mac_address: 00:1c:73:00:02:02
      ztp: false

  - rclarkavd-leaf3:
      node_type: veos
      ip_addr: 192.168.0.23/24
      serial_number: rclarkavd-leaf3
      system_mac_address: 00:1c:73:00:02:03
      ztp: false

  - rclarkavd-leaf4:
      node_type: veos
      ip_addr: 192.168.0.24/24
      serial_number: rclarkavd-leaf4
      system_mac_address: 00:1c:73:00:02:04
      ztp: false

  ###########################################################################
  # Member leaves (L2 access, dual-homed to a leaf pair)
  ###########################################################################

  - rclarkavd-mleaf1:
      node_type: veos
      ip_addr: 192.168.0.131/24
      serial_number: rclarkavd-mleaf1
      system_mac_address: 00:1c:73:00:03:01
      ztp: false

###############################################################################
# Data-plane links
#   spine <-> leaf full mesh: spine[i] Ethernet[j] <-> leaf[j] Ethernet[i]
#   MLAG peer links:          leaf<odd> <-> leaf<even> on the next two ports
#                             after the spine uplinks
#   Member-leaf uplinks:      mleaf:Eth1/2 <-> leaf<odd>/leaf<even> on the
#                             ports after the MLAG peer links
###############################################################################
links:
  - connection: [rclarkavd-spine1:Ethernet1, rclarkavd-leaf1:Ethernet1]
  - connection: [rclarkavd-spine1:Ethernet2, rclarkavd-leaf2:Ethernet1]
  - connection: [rclarkavd-spine1:Ethernet3, rclarkavd-leaf3:Ethernet1]
  - connection: [rclarkavd-spine1:Ethernet4, rclarkavd-leaf4:Ethernet1]

  - connection: [rclarkavd-spine2:Ethernet1, rclarkavd-leaf1:Ethernet2]
  - connection: [rclarkavd-spine2:Ethernet2, rclarkavd-leaf2:Ethernet2]
  - connection: [rclarkavd-spine2:Ethernet3, rclarkavd-leaf3:Ethernet2]
  - connection: [rclarkavd-spine2:Ethernet4, rclarkavd-leaf4:Ethernet2]

  # MLAG peer links
  - connection: [rclarkavd-leaf1:Ethernet3, rclarkavd-leaf2:Ethernet3]
  - connection: [rclarkavd-leaf1:Ethernet4, rclarkavd-leaf2:Ethernet4]
  - connection: [rclarkavd-leaf3:Ethernet3, rclarkavd-leaf4:Ethernet3]
  - connection: [rclarkavd-leaf3:Ethernet4, rclarkavd-leaf4:Ethernet4]

  # Member-leaf uplinks
  - connection: [rclarkavd-mleaf1:Ethernet1, rclarkavd-leaf1:Ethernet5]
  - connection: [rclarkavd-mleaf1:Ethernet2, rclarkavd-leaf2:Ethernet5]
